<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Натур Пласт · Центр решений</title>
<meta name="description" content="Демо-прототип аналитической системы для маркетплейсов: причины изменений продаж и маржи, решения и проверка эффекта.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F1EC; --surface:#FFFFFF; --surface-2:#F7F6F2; --line:#E2E0D8; --line-2:#ECEAE3;
  --ink:#16201C; --ink-2:#45514B; --ink-3:#7A847E;
  --brand:#1D3A30; --brand-2:#2B5244; --side:#12201A; --side-ink:#C3CEC8;
  --accent:#C4823A; --accent-bg:#F7ECDD;
  --pos:#2C7A55; --pos-bg:#E4F1E9; --neg:#B1453A; --neg-bg:#F6E5E2; --warn:#A8701C; --warn-bg:#FAF0DC;
  --neutral-bar:#33493F;
  --r:12px; --shadow:0 1px 2px rgba(22,32,28,.05),0 2px 8px rgba(22,32,28,.04);
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:'Onest',system-ui,-apple-system,'Segoe UI',sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;overflow-x:hidden}
button{font:inherit;color:inherit}
h1,h2,h3,h4{margin:0;font-weight:600;letter-spacing:-.01em}
small{font-size:13px}
.muted{color:var(--ink-3)}
.pos{color:var(--pos)} .neg{color:var(--neg)} .warn{color:var(--warn)}

/* ---------- layout ---------- */
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh}
.side{background:var(--side);color:var(--side-ink);position:sticky;top:0;height:100vh;padding:22px 14px;display:flex;flex-direction:column;gap:26px;z-index:30}
.brand{display:flex;gap:11px;align-items:center;padding:0 8px;color:#fff}
.brand-mark{width:34px;height:34px;flex:none}
.brand b{display:block;font-size:15px;font-weight:600;letter-spacing:.01em}
.brand span{display:block;font-size:12px;color:#8FA197;letter-spacing:.04em;text-transform:uppercase}
.nav{display:flex;flex-direction:column;gap:2px}
.nav-cap{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#6E8077;padding:0 10px 6px}
.nav button{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:8px;border:0;background:transparent;color:inherit;cursor:pointer;text-align:left;width:100%;font-size:14px}
.nav button svg{width:18px;height:18px;flex:none;opacity:.8}
.nav button:hover{background:rgba(255,255,255,.05);color:#fff}
.nav button.active{background:rgba(255,255,255,.08);color:#fff;box-shadow:inset 2px 0 0 var(--accent)}
.nav .cnt{margin-left:auto;background:var(--accent);color:#1b140b;font-size:12px;font-weight:600;border-radius:10px;padding:1px 7px}
.side-foot{margin-top:auto;font-size:12px;color:#7F9188;padding:0 10px;line-height:1.5}
.side-foot .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#5DB585;margin-right:6px;vertical-align:1px}

main{min-width:0;padding:0 36px 72px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px 20px;padding:16px 0;border-bottom:1px solid var(--line);margin-bottom:28px;flex-wrap:wrap}
.top-date{font-size:13px;color:var(--ink-2)}
.top-date b{color:var(--ink);font-weight:600}
.top-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.top-right label{font-size:12px;color:var(--ink-3)}

.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:3px;gap:2px;max-width:100%}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:7px;color:var(--ink-2);cursor:pointer;font-size:13px;white-space:nowrap}
.seg button:hover{color:var(--ink)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.1);font-weight:500}

.view{display:none}
.view.on{display:block;animation:fade .18s ease}
@keyframes fade{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}

.page-h{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.page-h h1{font-size:28px;line-height:1.15}
.page-h p{margin:6px 0 0;color:var(--ink-2);max-width:720px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:34px 0 14px;flex-wrap:wrap}
.sec-h h2{font-size:18px}
.sec-h .hint{font-size:13px;color:var(--ink-3)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 20px 0;flex-wrap:wrap}
.card-h h3{font-size:15px}
.card-b{padding:16px 20px 20px}

.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;cursor:pointer;font-size:13.5px;font-weight:500;white-space:nowrap}
.btn:hover{border-color:#C9C6BB}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{background:var(--brand-2)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink-2)}
.btn.ghost:hover{color:var(--ink);background:var(--surface-2)}
.btn.danger{color:var(--neg)}
.btn[disabled]{opacity:.45;cursor:not-allowed}

.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:500;border-radius:20px;padding:2px 9px;white-space:nowrap;background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line-2)}
.pill.pos{background:var(--pos-bg);color:var(--pos);border-color:transparent}
.pill.neg{background:var(--neg-bg);color:var(--neg);border-color:transparent}
.pill.warn{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.pill.brand{background:#E3EBE7;color:var(--brand);border-color:transparent}
.pill.accent{background:var(--accent-bg);color:#8A5517;border-color:transparent}
.ch{display:inline-block;font-size:12px;font-weight:600;letter-spacing:.03em;padding:1px 6px;border-radius:4px;background:#EDE9F5;color:#5A3E8C}
.ch.oz{background:#E2ECF8;color:#1F5296}

/* ---------- overview ---------- */
.greet h1{font-size:30px}
.greet p{font-size:15px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi{padding:16px 16px 12px;display:flex;flex-direction:column;gap:3px;min-width:0}
.kpi-l{font-size:13px;color:var(--ink-2);font-weight:500}
.kpi-v{font-size:24px;font-weight:600;letter-spacing:-.02em;margin-top:4px;white-space:nowrap}
.kpi-v span{font-size:14px;font-weight:500;color:var(--ink-2);margin-left:2px}
.kpi-sub{font-size:12px;color:var(--ink-3);min-height:17px}
.kpi-d{font-size:12px;color:var(--ink-3);display:flex;gap:6px;align-items:baseline}
.kpi-d b{font-weight:600;white-space:nowrap}
.kpi svg{width:100%;height:30px;margin-top:6px;display:block}

.cases{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.case{position:relative;padding:18px 20px 16px;display:flex;flex-direction:column;gap:8px;overflow:hidden}
.case::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--neg)}
.case.opp::before{background:var(--pos)}
.case.task::before{background:var(--warn)}
.case.done::before{background:var(--ink-3)}
.case-top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.case h3{font-size:16px;line-height:1.3}
.case .headline{color:var(--ink-2);font-size:14px}
.impact{font-size:22px;font-weight:600;letter-spacing:-.02em;margin-top:2px}
.impact small{font-size:13px;font-weight:500;color:var(--ink-3);margin-left:4px;letter-spacing:0}
.case .reason{margin:0;color:var(--ink-2);font-size:13.5px;flex:1}
.case-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:auto;padding-top:12px;flex-wrap:wrap}
.case-foot .meta{font-size:12px;color:var(--ink-3)}

.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;gap:12px;justify-content:space-between;align-items:baseline;padding:10px 0;border-bottom:1px solid var(--line-2);font-size:13.5px}
.list li:last-child{border-bottom:0}
.list li .r{text-align:right;white-space:nowrap}

/* ---------- analysis ---------- */
.back{border:0;background:none;color:var(--ink-2);cursor:pointer;padding:0;font-size:13px;margin-bottom:12px}
.back:hover{color:var(--ink)}
.case-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.case-tab{border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:6px 13px;font-size:13px;cursor:pointer;color:var(--ink-2);display:flex;gap:7px;align-items:center}
.case-tab i{width:7px;height:7px;border-radius:50%;background:var(--neg);display:inline-block}
.case-tab.opp i{background:var(--pos)} .case-tab.task i{background:var(--warn)}
.case-tab.on{border-color:var(--brand);color:var(--ink);box-shadow:inset 0 0 0 1px var(--brand)}
.an-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px 24px;flex-wrap:wrap;margin-bottom:18px}
.an-head h1{font-size:26px;line-height:1.2}
.an-head .sub{color:var(--ink-2);margin-top:6px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:0;margin-bottom:18px}
.metric{padding:14px 18px;border-right:1px solid var(--line-2)}
.metric:last-child{border-right:0}
.metric .l{font-size:12px;color:var(--ink-3)}
.metric .v{font-size:18px;font-weight:600;margin-top:3px;white-space:nowrap}
.metric .v .from{color:var(--ink-3);font-weight:500}
.metric .s{font-size:12px;color:var(--ink-3);margin-top:2px}
.an-grid{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(0,1fr);gap:14px;align-items:start}
.an-main{display:flex;flex-direction:column;gap:14px;min-width:0}

.wf{padding:6px 0 4px}
.wf-row{display:grid;grid-template-columns:minmax(170px,32%) minmax(0,1fr) 78px;gap:14px;align-items:center;padding:7px 20px;border-radius:0}
.wf-row.f{cursor:default}
.wf-row.kids{cursor:pointer}
.wf-row.kids:hover{background:var(--surface-2)}
.wf-row.tot{font-weight:600}
.wf-row.tot .wf-label{color:var(--ink)}
.wf-row.child{background:#FAF9F6}
.wf-row.child .wf-label{padding-left:22px}
.wf-label{display:flex;flex-direction:column;min-width:0;color:var(--ink)}
.wf-label .t{display:flex;align-items:center;gap:6px}
.wf-label small{color:var(--ink-3);font-size:12px;line-height:1.35;margin-top:1px}
.chev{display:inline-block;width:14px;height:14px;flex:none;transition:transform .15s;color:var(--ink-3)}
.wf-row.open .chev{transform:rotate(90deg)}
.chev.blank{visibility:hidden}
.wf-track{position:relative;height:20px;border-left:1px solid var(--line)}
.wf-bar{position:absolute;top:3px;bottom:3px;border-radius:3px;min-width:2px}
.wf-bar.tot{background:var(--neutral-bar)}
.wf-bar.neg{background:var(--neg)}
.wf-bar.pos{background:var(--pos)}
.wf-bar.zero{background:var(--ink-3);width:2px!important}
.wf-row.child .wf-bar{opacity:.65}
.wf-val{text-align:right;font-weight:600;white-space:nowrap}
.wf-foot{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:12px 20px 4px;border-top:1px solid var(--line-2);margin-top:6px;font-size:13px;color:var(--ink-3)}

table{border-collapse:collapse;width:100%}
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.tbl th{font-size:12px;font-weight:500;color:var(--ink-3);text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface)}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--line-2);vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tbl .n{text-align:right;white-space:nowrap}
.tbl th.n{text-align:right}
.tbl th.sort{cursor:pointer;user-select:none}
.tbl th.sort:hover{color:var(--ink)}
.tbl th.sort.on{color:var(--ink)}
.tbl th.sort .ar{display:inline-block;width:10px;margin-left:3px;color:var(--accent)}
.tbl tbody tr:hover td{background:#FBFAF7}
#v-products .tbl td{vertical-align:middle}

.fn td{vertical-align:middle}
.fn .bar{height:6px;border-radius:3px;background:var(--line-2);margin-top:5px;overflow:hidden}
.fn .bar i{display:block;height:100%;border-radius:3px;background:var(--neutral-bar)}
.fn .bar.p i{background:#9FB0A8}
.fn .bar.y i{background:#D7C3A6}
.fn .cv{font-size:12px;color:var(--ink-3);display:block}

.log{list-style:none;margin:0;padding:4px 0 0;position:relative}
.log li{position:relative;padding:0 0 16px 26px}
.log li::before{content:"";position:absolute;left:6px;top:16px;bottom:-2px;width:1px;background:var(--line)}
.log li:last-child::before{display:none}
.log .mk{position:absolute;left:0;top:3px;width:13px;height:13px;border-radius:50%;border:2px solid var(--ink-3);background:var(--surface)}
.log .mk.ok{border-color:#9DB3A8}
.log .mk.find{border-color:var(--neg);background:var(--neg-bg)}
.log .mk.next{border-color:var(--accent)}
.log .mk.sum{border-color:var(--brand);background:var(--brand)}
.log .tx{font-size:13.5px}
.log .lsrc{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.log .lsrc span{font-size:12px;color:var(--ink-3);background:var(--surface-2);border:1px solid var(--line-2);border-radius:4px;padding:0 6px}
.log .tm{font-size:12px;color:var(--ink-3);float:right;margin-left:8px}

.props{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.prop{padding:18px 20px;border:1px solid var(--line);border-radius:10px;background:var(--surface);display:flex;flex-direction:column;gap:10px;position:relative}
.prop.sel{border-color:var(--brand);box-shadow:inset 0 0 0 1px var(--brand)}
.prop.off{opacity:.55}
.prop-h{display:flex;gap:12px;align-items:flex-start}
.prop-h input{margin-top:3px;accent-color:var(--brand);width:16px;height:16px;flex:none}
.prop-h b{font-weight:600;font-size:14.5px;line-height:1.35}
.prop .eff{display:flex;gap:18px;flex-wrap:wrap;align-items:baseline}
.prop .eff .big{font-size:22px;font-weight:600;color:var(--pos);letter-spacing:-.02em}
.conf{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-2)}
.conf .m{width:70px;height:5px;border-radius:3px;background:var(--line-2);overflow:hidden}
.conf .m i{display:block;height:100%;background:var(--brand)}
.prop p{margin:0;color:var(--ink-2);font-size:13.5px}
.hist{font-size:13px;background:var(--surface-2);border-radius:8px;padding:10px 12px;color:var(--ink-2)}
.hist b{color:var(--ink);font-weight:600}
.edit-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:13px;background:var(--accent-bg);padding:8px 12px;border-radius:8px}
.edit-row input[type=range]{accent-color:var(--accent);width:160px;max-width:100%}
.actions{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:16px;padding-top:16px;border-top:1px solid var(--line-2)}
.actions .sum{font-size:14px;color:var(--ink-2)}
.actions .sum b{color:var(--ink);font-size:16px}
.reject-box{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px;font-size:13px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:5px 11px;cursor:pointer;font-size:13px}
.chip:hover{border-color:var(--neg);color:var(--neg)}
.banner{display:flex;gap:10px;align-items:center;padding:12px 16px;border-radius:10px;font-size:13.5px;margin-bottom:16px;flex-wrap:wrap}
.banner.ok{background:var(--pos-bg);color:#1F5B3F}
.banner.rej{background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line)}
.banner.role{background:#E3EBE7;color:var(--brand)}
.note{font-size:13px;color:var(--ink-3);margin-top:12px;line-height:1.5}
.calc-note{display:flex;gap:8px;align-items:flex-start;font-size:13px;color:var(--ink-2);background:var(--surface-2);border:1px dashed var(--line);border-radius:8px;padding:9px 12px}

/* ---------- decisions ---------- */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:8px}
.stat{padding:16px 18px}
.stat .l{font-size:13px;color:var(--ink-2)}
.stat .v{font-size:24px;font-weight:600;letter-spacing:-.02em;margin-top:4px}
.stat .v .from{font-size:16px;color:var(--ink-3);font-weight:500;text-decoration:line-through;margin-right:6px}
.stat .s{font-size:12px;color:var(--ink-3);margin-top:3px}
.learn{display:flex;gap:10px;align-items:center;font-size:13px;color:var(--ink-2);margin:14px 0 18px}
.learn svg{flex:none}
.dec .prod{font-weight:500}
.dec .sm{font-size:12px;color:var(--ink-3);margin-top:2px}
.dec td{font-size:13.5px}
.dec tr.new td{background:#F3F8F5}

/* ---------- products ---------- */
.prod-name{font-weight:500}
.prod-sku{font-size:12px;color:var(--ink-3)}
.cell-flag{display:inline-block;min-width:52px;padding:2px 7px;border-radius:5px;text-align:right}
.cell-flag.g{background:var(--pos-bg);color:var(--pos)}
.cell-flag.a{background:var(--warn-bg);color:var(--warn)}
.cell-flag.r{background:var(--neg-bg);color:var(--neg)}
.trend{display:inline-flex;align-items:center;gap:6px}
.trend svg{width:64px;height:20px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink-3);margin-top:12px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}

/* ---------- sources ---------- */
.srcs{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:14px}
.src{padding:18px 20px;display:flex;flex-direction:column;gap:8px}
.src-h{display:flex;justify-content:space-between;gap:10px;align-items:center}
.src-h b{font-size:15px;font-weight:600}
.src p{margin:0;font-size:13px;color:var(--ink-2)}
.src .kv{display:flex;justify-content:space-between;font-size:13px;color:var(--ink-3);border-top:1px solid var(--line-2);padding-top:8px;margin-top:auto}
.checks li{align-items:flex-start}
.checks .ic{width:18px;flex:none;font-weight:700}
details summary{cursor:pointer;color:var(--brand);font-size:13px;margin-top:6px}
details ul{margin:8px 0 0;padding-left:18px;font-size:13px;color:var(--ink-2)}
.where{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
.where div{padding:14px 16px;border-radius:10px;border:1px solid var(--line);font-size:13px;color:var(--ink-2);background:var(--surface-2)}
.where div.on{background:var(--surface);border-color:var(--brand);box-shadow:inset 0 0 0 1px var(--brand);color:var(--ink)}
.where b{display:block;margin-bottom:4px;color:var(--ink)}

/* ---------- modal / toast ---------- */
.modal-bg{position:fixed;inset:0;background:rgba(14,22,19,.45);display:none;align-items:center;justify-content:center;padding:16px;z-index:100}
.modal-bg.on{display:flex;animation:fade .15s}
.modal{background:var(--surface);border-radius:14px;max-width:560px;width:100%;max-height:calc(100vh - 32px);overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal-h{padding:20px 22px 0;display:flex;gap:12px;align-items:flex-start}
.modal-h .ok{width:34px;height:34px;border-radius:50%;background:var(--pos-bg);color:var(--pos);display:flex;align-items:center;justify-content:center;flex:none}
.modal-h h3{font-size:18px}
.modal-h p{margin:3px 0 0;color:var(--ink-2);font-size:13.5px}
.tcard{margin:16px 22px;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.tcard-top{background:var(--surface-2);padding:12px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--ink-3)}
.tcard-b{padding:14px 16px}
.tcard-b h4{font-size:15px;line-height:1.35;margin-bottom:12px}
.task-grid{display:grid;grid-template-columns:130px 1fr;gap:7px 12px;font-size:13px}
.task-grid dt{color:var(--ink-3)} .task-grid dd{margin:0}
.tcard ul{list-style:none;padding:0;margin:12px 0 0;font-size:13px}
.tcard ul li{display:flex;gap:9px;padding:5px 0;align-items:flex-start}
.tcard ul li i{width:14px;height:14px;border:1.5px solid #B9B6AC;border-radius:3px;flex:none;margin-top:2px}
.modal-f{padding:0 22px 20px;display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:10px 16px;border-radius:9px;font-size:13.5px;opacity:0;pointer-events:none;transition:.2s;z-index:120;max-width:calc(100vw - 32px)}
.toast.on{opacity:1;transform:translateX(-50%)}
.demo{position:fixed;right:14px;bottom:14px;background:rgba(22,32,28,.88);color:#E6ECE8;font-size:12px;padding:5px 10px;border-radius:6px;z-index:90;letter-spacing:.01em;pointer-events:none}

/* ---------- roles / tasks ---------- */
.perm{display:flex;gap:8px;align-items:flex-start;flex-wrap:wrap;font-size:13px;color:var(--ink-3)}
.perm .pill{flex:none}
.perm span.why{flex:1 1 200px}
.prop-act{display:flex;gap:8px;flex-wrap:wrap;margin-top:2px}
.prop-act .btn{white-space:normal;text-align:left;line-height:1.3}
.case.wait::before{background:var(--accent)}
.tasks li{flex-wrap:wrap;align-items:center}
.tasks .tt{flex:1 1 260px;min-width:0}
.tasks .tt b{font-weight:500;display:block}
.tasks .tt small{color:var(--ink-3)}
.tasks .tr{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tasks li.done .tt b{text-decoration:line-through;color:var(--ink-3)}

/* ---------- explanations ---------- */
.ex{display:flex;gap:8px;align-items:flex-start;font-size:13px;line-height:1.5;color:var(--ink-3);margin:0 0 12px;max-width:860px}
.ex i{flex:none;width:16px;height:16px;border-radius:50%;background:var(--accent-bg);color:#8A5517;font-style:normal;font-weight:700;font-size:12px;display:inline-flex;align-items:center;justify-content:center;margin-top:1px}
.ex b{color:var(--ink-2);font-weight:600}
.ex.in{margin:8px 20px 0}
.sec-h + .ex{margin-top:-6px}
body.no-ex .ex, body.no-ex .intro, body.no-ex .tip{display:none!important}
.intro{position:relative;background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:10px;padding:14px 44px 12px 18px;margin-bottom:22px;font-size:13.5px;color:var(--ink-2);box-shadow:var(--shadow)}
.intro b{color:var(--ink)}
.intro p{margin:0 0 6px}
.intro .hint2{color:var(--ink)}
.intro .fine{font-size:12px;color:var(--ink-3);margin:6px 0 0}
.intro .x{position:absolute;right:8px;top:8px;border:0;background:none;cursor:pointer;color:var(--ink-3);font-size:18px;line-height:1;padding:6px 8px;border-radius:6px}
.intro .x:hover{background:var(--surface-2);color:var(--ink)}
.tip{position:relative;display:inline-flex;width:17px;height:17px;border-radius:50%;background:var(--accent-bg);color:#8A5517;font-size:12px;font-weight:700;align-items:center;justify-content:center;cursor:help;outline:none;flex:none}
.tip span{display:none;position:absolute;top:24px;right:-10px;width:270px;background:var(--ink);color:#EEF2EF;font-weight:400;font-size:13px;line-height:1.45;padding:10px 12px;border-radius:8px;z-index:60;box-shadow:0 8px 24px rgba(0,0,0,.2);text-align:left}
.tip:hover span,.tip:focus span{display:block}
.ex-tog{display:inline-flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-3);border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:6px 10px;cursor:pointer}
.ex-tog .sw{width:28px;height:16px;border-radius:9px;background:#CFCBC0;position:relative;transition:.15s}
.ex-tog .sw::after{content:"";position:absolute;left:2px;top:2px;width:12px;height:12px;border-radius:50%;background:#fff;transition:.15s}
.ex-tog.on .sw{background:var(--accent)}
.ex-tog.on .sw::after{left:14px}
.ex-tog b{color:var(--ink);font-weight:500}

/* ---------- assistant ---------- */
.ask-tab{position:fixed;right:0;top:50%;transform:translateY(-50%);z-index:105;display:flex;flex-direction:column;align-items:center;gap:8px;background:var(--brand);color:#fff;border:0;border-radius:10px 0 0 10px;padding:14px 9px;cursor:pointer;box-shadow:-4px 4px 16px rgba(22,32,28,.22);font-weight:600;font-size:13px;letter-spacing:.02em;transition:right .22s ease,background .15s}
.ask-tab:hover{background:var(--brand-2)}
.ask-tab svg{width:18px;height:18px;flex:none}
.ask-tab span{writing-mode:vertical-rl;transform:rotate(180deg);white-space:nowrap}
body.chat-open .ask-tab{background:var(--accent);color:#1b140b}
@media (min-width:1280px){
  body.chat-open .app{margin-right:440px}
  body.chat-open .ask-tab{right:440px}
  body.chat-open .chat{box-shadow:none}
  body.chat-open .demo{right:454px}
}
.chat{position:fixed;top:0;right:0;bottom:0;width:440px;max-width:100%;background:var(--surface);border-left:1px solid var(--line);box-shadow:-12px 0 40px rgba(0,0,0,.12);z-index:110;display:flex;flex-direction:column;transform:translateX(105%);transition:transform .22s ease}
.chat.on{transform:none}
.chat-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.chat-h b{font-size:15px;font-weight:600;display:block}
.chat-h small{color:var(--ink-3)}
.chat-h .lnk{border:0;background:none;color:var(--brand);font-size:13px;cursor:pointer;text-decoration:underline;padding:0}
.chat-h .x{border:0;background:none;font-size:22px;line-height:1;cursor:pointer;color:var(--ink-3);padding:4px 8px;border-radius:6px}
.chat-b{flex:1;overflow-y:auto;padding:14px 16px;display:flex;flex-direction:column;gap:12px;background:var(--surface-2)}
.msg{display:flex}
.msg.u{justify-content:flex-end}
.bub{max-width:92%;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 13px;font-size:13.5px;line-height:1.45;min-width:0}
.msg.u .bub{background:var(--brand);color:#fff;border-color:var(--brand)}
.bub p{margin:0 0 8px}
.bub table{font-size:13px;margin:6px 0 8px}
.bub table td,.bub table th{padding:5px 6px;border-bottom:1px solid var(--line-2);text-align:left}
.bub table th{color:var(--ink-3);font-weight:500;font-size:12px}
.bub table .n{text-align:right;white-space:nowrap}
.bub .acts{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 4px}
.bub .acts .btn{padding:6px 11px;font-size:13px;white-space:normal}
.how{margin-top:8px;font-size:12px;color:var(--ink-2)}
.how summary{color:var(--ink-3);font-size:12px;margin:0}
.how ul{margin:6px 0 4px;padding-left:16px}
.how li{margin:2px 0}
.mdl{display:inline-flex;align-items:center;gap:6px;margin-top:8px;font-size:12px;color:var(--ink-2);background:var(--surface-2);border:1px solid var(--line-2);border-radius:20px;padding:2px 9px}
.mdl i{width:7px;height:7px;border-radius:50%;background:var(--pos);display:inline-block}
.mdl.strong i{background:var(--accent)}
.typing{display:inline-flex;gap:4px;align-items:center;color:var(--ink-3);font-size:13px}
.typing span{width:6px;height:6px;border-radius:50%;background:var(--ink-3);animation:bl 1s infinite}
.typing span:nth-child(2){animation-delay:.15s}.typing span:nth-child(3){animation-delay:.3s}
@keyframes bl{0%,100%{opacity:.25}50%{opacity:1}}
.chips{display:flex;gap:6px;flex-wrap:wrap;padding:10px 16px 0;border-top:1px solid var(--line)}
.chips .chip:hover{border-color:var(--brand);color:var(--brand)}
.chat-f{display:flex;gap:8px;padding:10px 16px 14px}
.chat-f input{flex:1;min-width:0;border:1px solid var(--line);border-radius:9px;padding:9px 12px;font:inherit;font-size:14px;background:var(--surface)}
.chat-f input:focus{outline:2px solid #C9D8D0;border-color:var(--brand)}
.route{display:flex;gap:6px;align-items:stretch;flex-wrap:wrap;margin:6px 0 12px}
.route div{flex:1 1 92px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 9px;font-size:12px;color:var(--ink-2);position:relative}
.route div b{display:block;color:var(--ink);font-size:13px;margin-bottom:2px}
.route div.hl{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.route .ar{flex:0 0 auto;align-self:center;color:var(--accent);font-weight:700;border:0;background:none;padding:0}
.tiers{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tier{border:1px solid var(--line);border-radius:10px;padding:12px 13px;font-size:13px;color:var(--ink-2);background:var(--surface)}
.tier b{display:block;color:var(--ink);font-size:13.5px;margin-bottom:4px}
.tier .mdl{margin-top:6px}
.rt-list{margin:10px 0 0;padding-left:18px;font-size:13px;color:var(--ink-2)}
.rt-list li{margin:3px 0}
.cost{margin-top:10px;font-size:13px}
.cost td{padding:6px 8px;border-bottom:1px solid var(--line-2)}
.cost td:last-child{text-align:right;white-space:nowrap;font-weight:500}

/* ---------- market ---------- */
.alert{display:flex;gap:10px;align-items:flex-start;background:var(--accent-bg);color:#6E4512;border-radius:10px;padding:12px 16px;font-size:13.5px;margin:14px 0}
.alert b{color:#5A3810}
.seas{width:100%;height:170px;display:block}
.seas-top{display:flex;font-size:12px;color:var(--ink-3);margin-bottom:4px}.seas-top span{flex:1}
.seas-m{display:flex;font-size:12px;color:var(--ink-3);margin-top:4px}.seas-m span{flex:1;text-align:center}
tr.us td{background:#F1F6F3}
tr.us td:first-child{box-shadow:inset 3px 0 0 var(--brand)}
.nopos{color:var(--neg);font-weight:600}
.audit{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:14px}
.score{display:flex;align-items:baseline;gap:6px;margin-bottom:10px}
.score b{font-size:40px;font-weight:600;letter-spacing:-.03em}
.ab{display:grid;grid-template-columns:minmax(0,1fr) 54px;gap:3px 10px;align-items:center;font-size:13px;padding:6px 0;border-bottom:1px solid var(--line-2)}
.ab .bar{grid-column:1/-1;height:5px;border-radius:3px;background:var(--line-2);overflow:hidden}
.ab .bar i{display:block;height:100%;background:var(--brand)}
.ab .bar i.lo{background:var(--neg)} .ab .bar i.mid{background:var(--accent)}
.ab small{color:var(--ink-3);grid-column:1/-1}
.reco li{align-items:center;flex-wrap:wrap}
.reco .tt{flex:1 1 220px;min-width:0}
.reco .tt small{display:block;color:var(--ink-3)}
.quote{font-size:13px;color:var(--ink-2);font-style:italic}

/* ---------- departments ---------- */
.concept{font-size:13px;color:var(--brand);text-decoration:none;border:1px solid var(--line);border-radius:9px;padding:6px 10px;background:var(--surface);white-space:nowrap}
.concept:hover{border-color:var(--brand)}
.deps{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,210px),1fr));gap:12px}
.dep{padding:16px;display:flex;flex-direction:column;gap:6px;min-width:0}
.dep-h{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 8px;align-items:flex-start}
.dep-h .pill{white-space:nowrap}
.dep-h b{font-weight:600;font-size:14px;line-height:1.3}
.dep-h .pill{flex:none}
.dep-k{font-size:12px;color:var(--ink-3);min-height:32px}
.dep-v{font-size:22px;font-weight:600;letter-spacing:-.02em}
.dep-v .muted{font-size:13px;font-weight:500;letter-spacing:0}
.dep-t{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--ink-2);flex-wrap:wrap}
.dep svg{width:100%;height:28px;display:block}
.bar{height:6px;border-radius:3px;background:var(--line-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--brand)}
.bar i.pos{background:var(--pos)} .bar i.warn{background:var(--accent)} .bar i.neg{background:var(--neg)}
.meet{align-items:start}

/* ---------- popover / folds ---------- */
.qt{display:inline-flex;width:18px;height:18px;border-radius:50%;background:var(--accent-bg);color:#8A5517;font-size:12px;font-weight:700;align-items:center;justify-content:center;cursor:help;margin-left:8px;vertical-align:2px;flex:none;letter-spacing:0;font-style:normal;user-select:none}
.qt:hover,.qt:focus{background:var(--accent);color:#fff;outline:none}
body.no-ex .qt{display:none!important}
.pop{position:fixed;z-index:300;max-width:320px;background:var(--ink);color:#EEF2EF;font-size:13px;line-height:1.45;padding:10px 12px;border-radius:9px;box-shadow:0 10px 30px rgba(0,0,0,.22);display:none}
.pop.on{display:block}
.pop b{color:#fff}
.sec-h.foldable{cursor:pointer;user-select:none}
.fold-t{font-size:13px;color:var(--brand);margin-left:10px;white-space:nowrap}
.fold-body.shut{display:none}
.why-d{font-size:13px;color:var(--ink-2)}
.why-d summary{cursor:pointer;color:var(--brand);font-size:13px}
.why-d[open] summary{margin-bottom:8px}
.why-d p{margin:0 0 8px}
.kpi-sw{display:flex;align-items:center;gap:4px}
.steps{margin:8px 0 2px;padding-left:20px;color:var(--ink-2)}
.steps li{margin:3px 0}
.log-more{border:0;background:none;color:var(--brand);cursor:pointer;padding:0;font-size:13px;margin-left:26px}

@media (min-width:901px){ main{padding-right:64px} }
/* ---------- responsive ---------- */
@media (max-width:900px){
  .side{padding-right:58px}
  .ask-tab{top:10px;right:10px;transform:none;border-radius:9px;padding:9px;box-shadow:none}
  .ask-tab span{display:none}
  body.chat-open .ask-tab{display:none}
}
@media (min-width:901px) and (max-width:1279px){
  body.chat-open .ask-tab{right:440px}
}
@media (max-width:1180px){
  .an-grid{grid-template-columns:1fr}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:900px){
  .app{grid-template-columns:1fr;grid-template-rows:auto 1fr}
  .side{height:auto;flex-direction:row;align-items:center;padding:10px 12px;gap:12px;overflow:hidden}
  .brand{padding:0}
  .brand div{display:none}
  .nav{flex-direction:row;overflow-x:auto;flex:1;scrollbar-width:none;gap:4px}
  .nav::-webkit-scrollbar{display:none}
  .nav-cap,.side-foot{display:none}
  .nav button{width:auto;white-space:nowrap;padding:7px 10px;font-size:13px}
  .nav button svg{display:none}
  .nav button.active{box-shadow:inset 0 -2px 0 var(--accent)}
  main{padding:0 16px 64px}
  .two,.props,.where,.cases{grid-template-columns:minmax(0,1fr)}
  .pill{white-space:normal}
  .top{margin-bottom:20px}
}
@media (max-width:640px){
  .greet h1{font-size:24px}
  .page-h h1,.an-head h1{font-size:22px}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .kpi{padding:12px 12px 10px}
  .kpi-v{font-size:20px}
  .kpi-d{flex-wrap:wrap;gap:0 5px}
  .wf-row{grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;padding:8px 16px}
  .wf-track{grid-column:1/-1;order:3}
  .metric{border-right:0;border-bottom:1px solid var(--line-2);padding:10px 14px}
  .metrics{grid-template-columns:1fr 1fr}
  .stats{grid-template-columns:1fr 1fr}
  .stat .v{font-size:20px}
  .card-h{padding:14px 16px 0}
  .card-b{padding:14px 16px 16px}
  .top-right{width:100%}
  .top-right .seg{width:100%}
  .top-right .seg button{flex:1;white-space:normal;line-height:1.2}
  .task-grid{grid-template-columns:1fr}
  .task-grid dt{margin-top:6px}
  .demo{font-size:10px;right:8px;bottom:8px}
  .chat{width:100%;border-left:0}
  .tiers,.audit{grid-template-columns:1fr}
  .route .ar{transform:none}
  .chips{flex-wrap:nowrap;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
  .chips .chip{white-space:nowrap}
  .page-h > .seg{flex-wrap:wrap}
  .page-h > .seg button{flex:1 1 auto}
  .ex.in{margin:8px 16px 0}
  .tip span{right:auto;left:-120px;width:250px}
}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 34 34" aria-hidden="true"><rect width="34" height="34" rx="8" fill="#1D3A30"/><text x="17" y="22.5" text-anchor="middle" font-family="Onest, sans-serif" font-size="14" font-weight="700" fill="#C4823A">НП</text></svg>
      <div><b>Натур Пласт</b><span>Центр решений</span></div>
    </div>
    <nav class="nav" id="nav">
      <div class="nav-cap">Работа</div>
      <button data-act="go" data-view="overview" class="active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>Обзор дня<span class="cnt" id="navCnt">4</span></button>
      <button data-act="go" data-view="analysis"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l5 5"/></svg>Разбор</button>
      <button data-act="go" data-view="decisions"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="8.5"/><path d="M8 12.3l2.7 2.7L16.2 9.5"/></svg>Решения и эффект</button>
      <button data-act="go" data-view="products"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M3.5 7.5L12 3l8.5 4.5v9L12 21l-8.5-4.5z"/><path d="M3.5 7.5L12 12l8.5-4.5M12 12v9"/></svg>Товары</button>
      <button data-act="go" data-view="market"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M3.5 20.5h17"/><path d="M5 16l4.5-5 3.5 3 6-7"/><path d="M15 7h4v4"/></svg>Рынок</button>
      <button data-act="go" data-view="departments" id="navDep"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="11" width="5" height="9" rx="1"/><rect x="9.5" y="6" width="5" height="14" rx="1"/><rect x="16" y="3" width="5" height="17" rx="1"/></svg>Отделы</button>
      <button data-act="go" data-view="sources"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><ellipse cx="12" cy="6" rx="7.5" ry="3"/><path d="M4.5 6v12c0 1.7 3.4 3 7.5 3s7.5-1.3 7.5-3V6M4.5 12c0 1.7 3.4 3 7.5 3s7.5-1.3 7.5-3"/></svg>Источники данных</button>
    </nav>
    <div class="side-foot"><span class="dot"></span>Данные актуальны на 07:20<br>Следующая загрузка в 13:00<br><a href="https://github.com/electrocow0-tech/decision-center-demo" target="_blank" rel="noopener" style="color:#C4823A">Концепция →</a></div>
  </aside>

  <main>
    <header class="top">
      <div class="top-date"><b>Пятница, 9 октября 2026</b> · неделя 2–8 октября</div>
      <div class="top-right">
        <a class="concept" href="https://github.com/electrocow0-tech/decision-center-demo" target="_blank" rel="noopener">Концепция →</a>
        <button class="ex-tog on" id="exTog" data-act="extog" aria-pressed="true"><span class="sw"></span><span>Пояснения: <b id="exTogL">вкл</b></span></button>
        <label>Роль</label>
        <span class="qt" tabindex="0" role="button" aria-label="Пояснение" data-tip="Роли различаются данными и правами. Руководитель видит финансы и согласует крупные решения; менеджер — свои товары и задачи и действует в пределах полномочий.">?</span>
        <div class="seg" id="roleSeg">
          <button data-act="role" data-role="ceo" class="on">Руководитель</button>
          <button data-act="role" data-role="mp">Менеджер маркетплейса</button>
        </div>
      </div>
    </header>

    <section class="view on" id="v-overview"></section>
    <section class="view" id="v-analysis"></section>
    <section class="view" id="v-decisions"></section>
    <section class="view" id="v-products"></section>
    <section class="view" id="v-market"></section>

function applySelf(pid){

function seasChart(N){
  var w = 600, h = 160, n = N.seas.length, mx = Math.max.apply(null, N.seas) * 1.08, bw = w / n;
  var g = '<line x1="' + (12 * bw) + '" x2="' + (12 * bw) + '" y1="0" y2="' + h + '" stroke="#C9C6BB" stroke-dasharray="3 3" vector-effect="non-scaling-stroke"/>';
  N.seas.forEach(function(v, i){
    var bh = v / mx * h;
    g += '<rect x="' + (i * bw + bw * 0.14).toFixed(1) + '" y="' + (h - bh).toFixed(1) + '" width="' + (bw * 0.72).toFixed(1) + '" height="' + bh.toFixed(1) + '" fill="' + (i === n - 1 ? '#C4823A' : (i >= 12 ? '#33493F' : '#B9C6BF')) + '"><title>' + nf(v, 1) + ' млн ₽</title></rect>';
  });
  return '<div class="seas-top"><span>2024–25</span><span>2025–26</span></div><svg class="seas" viewBox="0 0 ' + w + ' ' + h + '" preserveAspectRatio="none" role="img" aria-label="Сезонность ниши, млн ₽ в месяц">' + g + '</svg>' +
    '<div class="seas-m">' + MONTHS.map(function(m){ return '<span>' + m + '</span>'; }).join('') + '</div>';
}

    '</tbody></table></div></div>';

  var items = meetingItems(), done = items.filter(function(i){ return i[4][0] === 'pos'; }).length;

    '</ul></div></div><div class="card"><div class="card-h"><h3>Исполнение решений планёрок</h3></div><div class="card-b"><div class="stat" style="padding:0"><div class="l">Выполнено в срок, последние 8 планёрок</div><div class="v">64% <span class="muted" style="font-size:15px;font-weight:500">цель 85%</span></div><div class="bar" style="margin:10px 0 6px"><i class="warn" style="width:64%"></i></div><div class="s">по этой планёрке: ' + done + ' из ' + items.length + ' выполнено в срок, остальные в работе или просрочены</div></div>' +

/* ---------------- popover & folds ---------------- */
var POP = document.createElement('div'); POP.className = 'pop'; POP.setAttribute('role', 'tooltip'); document.body.appendChild(POP);
var popFor = null, popPinned = false;
function showPop(el, pin){
  popFor = el; popPinned = !!pin; POP.innerHTML = el.getAttribute('data-tip'); POP.classList.add('on');
  var r = el.getBoundingClientRect(), w = POP.offsetWidth, h = POP.offsetHeight;
  var left = Math.max(8, Math.min(r.left - 12, window.innerWidth - w - 8)), top = r.bottom + 8;
  if (top + h > window.innerHeight - 8) top = Math.max(8, r.top - h - 8);
  POP.style.left = left + 'px'; POP.style.top = top + 'px';
}
function hidePop(){ POP.classList.remove('on'); popFor = null; popPinned = false; }
var HOVER = window.matchMedia && window.matchMedia('(hover: hover)').matches;
document.addEventListener('mouseover', function(e){ var q = e.target.closest && e.target.closest('.qt'); if (q && HOVER && !popPinned) showPop(q); });
document.addEventListener('mouseout', function(e){ var q = e.target.closest && e.target.closest('.qt'); if (q && !popPinned) hidePop(); });
document.addEventListener('click', function(e){
  var q = e.target.closest('.qt');
  if (q){ e.preventDefault(); e.stopPropagation(); if (popFor === q && popPinned) hidePop(); else showPop(q, true); return; }
  if (popFor && !e.target.closest('.pop')) hidePop();
  var sh = e.target.closest('.sec-h.foldable');
  if (sh && !e.target.closest('button,a,input')){ var b = sh.nextElementSibling, key = sh.getAttribute('data-key'); var shut = !b.classList.contains('shut'); b.classList.toggle('shut', shut); S.fold[key] = !shut; sh.querySelector('.fold-t').textContent = shut ? 'Подробнее ▾' : 'Свернуть ▴'; }
}, true);
window.addEventListener('scroll', function(){ if (popFor) hidePop(); }, true);
function postRender(){
  document.querySelectorAll('.qt:not([data-p])').forEach(function(el){
    el.setAttribute('data-p', '1');
    var prev = el.previousElementSibling;
    while (prev && prev.classList.contains('banner')) prev = prev.previousElementSibling;
    if (prev && prev.matches('.sec-h,.card-h,.page-h,.modal-h')){ var hd = prev.querySelector('h1,h2,h3'); if (hd) hd.appendChild(el); }
  });
  document.querySelectorAll('.sec-h[data-fold]:not([data-done])').forEach(function(sh){
    sh.setAttribute('data-done', '1');
    var key = sh.querySelector('h2').textContent, open = S.fold[key] != null ? S.fold[key] : sh.getAttribute('data-fold') === 'open';
    sh.setAttribute('data-key', key); sh.classList.add('foldable');
    var body = document.createElement('div'); body.className = 'fold-body' + (open ? '' : ' shut');
    var n = sh.nextElementSibling;
    while (n && !n.matches('.sec-h,.page-h')){ var nx = n.nextElementSibling; body.appendChild(n); n = nx; }
    sh.parentNode.insertBefore(body, sh.nextSibling);
    var hint = sh.querySelector('.hint'); if (!hint){ hint = document.createElement('span'); hint.className = 'hint'; sh.appendChild(hint); }
    var t = document.createElement('span'); t.className = 'fold-t'; t.textContent = open ? 'Свернуть ▴' : 'Подробнее ▾'; hint.appendChild(t);
  });
}
new MutationObserver(function(){ postRender(); }).observe(document.body, {childList:true, subtree:true});

/* ---------------- routing ---------------- */
function renderAll(){
  document.body.classList.toggle('no-ex', !S.ex); var tg = $('#exTog'); tg.classList.toggle('on', S.ex); tg.setAttribute('aria-pressed', S.ex); $('#exTogL').textContent = S.ex ? 'вкл' : 'выкл';
  renderOverview(); renderAnalysis(); renderDecisions(); renderProducts(); renderMarket(); renderDepartments(); renderSources();
  $('#navDep').style.display = S.role === 'ceo' ? '' : 'none';
  if ($('#chat').classList.contains('on')) renderChat();
  document.querySelectorAll('.view').forEach(function(v){ v.classList.toggle('on', v.id === 'v-' + S.view); });
  document.querySelectorAll('#nav button').forEach(function(b){ b.classList.toggle('active', b.dataset.view === S.view); });
  document.querySelectorAll('#roleSeg button').forEach(function(b){ b.classList.toggle('on', b.dataset.role === S.role); });
}
function go(view){ S.view = view; try { localStorage.setItem('np-demo-view', view); } catch(e) {} renderAll(); window.scrollTo(0, 0); }
function closeModal(){ $('#modal').classList.remove('on'); }

document.addEventListener('click', function(e){
  var t = e.target.closest('[data-act]'); if (!t) return;
  var a = t.dataset.act;
  if (a === 'go') return go(t.dataset.view);
  if (a === 'role'){ S.role = t.dataset.role; S.rejectOpen = false; S.chat = []; renderAll(); return toast(S.role === 'ceo' ? 'Роль: руководитель — вся компания, согласование решений' : 'Роль: Ольга, менеджер WB — свои товары и задачи'); }
  if (a === 'apply') return applySelf(t.dataset.p);
  if (a === 'intro-steps'){ e.preventDefault(); S.introSteps = !S.introSteps; return renderOverview(); }
  if (a === 'logall'){ S.logAll[S.caseId] = !S.logAll[S.caseId]; return renderAnalysis(); }
  if (a === 'niche'){ S.niche = t.dataset.n; return renderMarket(); }
  if (a === 'go-market'){ e.preventDefault(); S.niche = t.dataset.n; return go('market'); }
  if (a === 'reco'){ var no = S.taskNo++; S.recoTask[t.dataset.k] = no; renderMarket(); return toast('Задача #' + no + ' создана в Битрикс24 · ответственный О. Ковалёва'); }
  if (a === 'depreco'){ var nd = S.taskNo++; S.recoTask['dep' + t.dataset.i] = nd; renderDepartments(); return toast('Задача #' + nd + ' создана в Битрикс24 · ответственный ' + DEP_RECO[+t.dataset.i][2]); }
  if (a === 'chat-open') return $('#chat').classList.contains('on') ? closeChat() : openChat();
  if (a === 'chat-close') return closeChat();
  if (a === 'chat-how'){ S.chatHow = !S.chatHow; return renderChat(); }
  if (a === 'ask') return ask(t.dataset.t, t.dataset.q);
  if (a === 'chat-go'){ if (window.innerWidth < 1280) closeChat(); return go(t.dataset.view); }
  if (a === 'chat-supply'){ var n2 = S.taskNo++; S.supplyTask = n2; TASKS.push({no:n2, title:'Кашпо 3 л: поставка 600 шт на WB Казань', due:'11.10', dueTxt:'новая · срок 11.10', from:ROLES[S.role].short, isNew:true}); S.chat.forEach(function(m){ if (m.html.indexOf('chat-supply') >= 0) m.html = answer('stock'); }); renderAll(); renderChat(); return toast('Поставка создана: задача #' + n2 + ' в Битрикс24'); }
  if (a === 'sendup') return sendUp(t.dataset.p);
  if (a === 'taskdone') return taskDone(parseInt(t.dataset.t, 10));
  if (a === 'extog'){ S.ex = !S.ex; if (S.ex) S.intro = true; try { localStorage.setItem('np-demo-ex', S.ex ? '1' : '0'); localStorage.setItem('np-demo-intro', '1'); } catch(e) {} return renderAll(); }
  if (a === 'intro-x'){ S.intro = false; try { localStorage.setItem('np-demo-intro', '0'); } catch(e) {} return renderOverview(); }
  if (a === 'kpi'){ S.kpi = t.dataset.k; return renderOverview(); }
  if (a === 'open'){ e.preventDefault(); if (window.innerWidth < 1280) closeChat(); S.caseId = t.dataset.case; S.rejectOpen = false; if (S.caseId !== 'a') S.period = 'week'; return go('analysis'); }
  if (a === 'period'){ S.period = t.dataset.p; return renderAnalysis(); }
  if (a === 'wf'){ S.open[t.dataset.id] = !S.open[t.dataset.id]; return renderAnalysis(); }
  if (a === 'editp'){ CASES[S.caseId].props.forEach(function(p){ if (p.edit) S.edits['_open_' + p.id] = !S.edits['_open_' + p.id]; }); if (!CASES[S.caseId].props.some(function(p){ return p.edit; })) toast('Отметьте нужные действия галочками — состав предложения изменится'); return renderAnalysis(); }
  if (a === 'reject'){ S.rejectOpen = !S.rejectOpen; return renderAnalysis(); }
  if (a === 'rejwhy') return reject(t.dataset.why);
  if (a === 'approve') return approve();
  if (a === 'closemodal'){ e.preventDefault(); return closeModal(); }
  if (a === 'closemodal-ov'){ closeModal(); return go('overview'); }
  if (a === 'go-dec'){ closeModal(); return go('decisions'); }
  if (a === 'sort'){ var k = t.dataset.k; S.sort = {k:k, d: S.sort.k === k ? -S.sort.d : (k === 'n' || k === 'mgr' ? 1 : -1)}; return renderProducts(); }
  if (a === 'where'){ S.where = t.dataset.w; renderSources(); return toast(S.where === 'cloud' ? 'Модели: облако' : 'Модели: сервер компании'); }
});
document.addEventListener('change', function(e){
  var t = e.target;
  if (t.dataset.act === 'sel'){
    var c = CASES[S.caseId];
    if (c.exclusive) c.props.forEach(function(p){ S.sel[c.id][p.id] = p.id === t.dataset.p; });
    else S.sel[c.id][t.dataset.p] = t.checked;
    renderAnalysis();
  }
});
document.addEventListener('input', function(e){
  var t = e.target;
  if (t.dataset.act === 'edit'){ S.edits[t.dataset.p] = parseFloat(t.value); renderAnalysis(); var el = document.querySelector('[data-act="edit"][data-p="' + t.dataset.p + '"]'); if (el) el.focus(); }
});
document.addEventListener('submit', function(e){
  if (e.target.id !== 'chatForm') return;
  e.preventDefault(); var i = $('#chatInput'), v = i.value.trim(); if (!v) return; i.value = ''; ask(v);
});
document.addEventListener('keydown', function(e){
  if (e.key === 'Escape'){ if (popFor) return hidePop(); closeModal(); closeChat(); }
  if ((e.key === 'Enter' || e.key === ' ') && e.target.dataset && e.target.dataset.act === 'wf'){ e.preventDefault(); e.target.click(); }
});
$('#modal').addEventListener('click', function(e){ if (e.target.id === 'modal') closeModal(); });

renderAll();
if (/chat/.test(location.hash)){ openChat(); S.chat.push({who:'u', html:'Сколько кашпо 3 л на складах'}, {who:'b', html:answer('stock')}); renderChat(); var dd = document.querySelector('#chatBody details'); if (dd) dd.open = true; }
})();
